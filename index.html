<style>
  :root {
    --glass: rgba(255,255,255,0.10);
    --glass-strong: rgba(255,255,255,0.18);
    --bordo: rgba(255,255,255,0.22);
    --testo: #ffffff;
    --testo-soft: rgba(255,255,255,0.72);
    --accento: #4fc3ff;
    --successo: #22d3a6;
    --pericolo: #ff6b6b;
    --raggio: 20px;
    --raggio-s: 12px;
    --max: 1100px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--testo);
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364) fixed;
    overflow-x: hidden;
    padding: clamp(14px, 3vw, 32px);
  }

  /* ---------- Sfondo animato ---------- */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(90px); opacity: .45; z-index: -1;
    animation: fluttua 20s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .blob.b1 { width: 420px; height: 420px; background: #00c6ff; top: -120px; left: -120px; }
  .blob.b2 { width: 380px; height: 380px; background: #a855f7; bottom: -140px; right: -100px; animation-delay: -7s; }
  .blob.b3 { width: 300px; height: 300px; background: #22d3a6; top: 45%; left: 45%; animation-delay: -14s; }
  @keyframes fluttua {
    0%   { transform: translate(0,0) scale(1); }
    50%  { transform: translate(60px,-40px) scale(1.08); }
    100% { transform: translate(-40px,50px) scale(.95); }
  }

  /* ---------- Layout ---------- */
  header, main { max-width: var(--max); margin: 0 auto; }

  header { text-align: center; margin-bottom: 28px; }
  header h1 {
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--testo-soft);
    text-transform: uppercase;
    letter-spacing: .18em;
    font-size: .8rem;
  }

  /* ---------- Pannelli in vetro ---------- */
  .card {
    background: var(--glass);
    border: 1px solid var(--bordo);
    border-radius: var(--raggio);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
    padding: clamp(18px, 3vw, 28px);
    margin-bottom: 22px;
  }
  .card h2 { margin: 0 0 18px; font-size: 1.25rem; font-weight: 700; }

  /* ---------- Statistiche ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 22px;
  }
  .stats .card { margin: 0; text-align: center; padding: 20px 12px; }
  .stats .num {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff, var(--accento));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .stats .lbl {
    margin-top: 6px;
    font-size: .78rem;
    color: var(--testo-soft);
    text-transform: uppercase;
    letter-spacing: .1em;
  }

  /* ---------- Modulo ---------- */
  form { margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px 16px;
  }
  .grid .full { grid-column: 1 / -1; }

  label {
    display: block;
    font-size: .78rem;
    font-weight: 600;
    color: var(--testo-soft);
    margin-bottom: 6px;
    letter-spacing: .02em;
  }

  input, select, textarea, .durata-box {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid var(--bordo);
    border-radius: var(--raggio-s);
    color: var(--testo);
    font: inherit;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  textarea { height: auto; min-height: 90px; padding: 12px 14px; resize: vertical; }
  input::placeholder, textarea::placeholder { color: rgba(255,255,255,.45); }
  select option { color: #000; }
  input[type="date"], input[type="time"] { color-scheme: dark; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accento);
    background: rgba(255,255,255,.12);
    box-shadow: 0 0 0 3px rgba(79,195,255,.25);
  }

  .durata-box {
    display: flex; align-items: center;
    font-weight: 800; font-size: 1.1rem;
    color: var(--accento);
    background: rgba(79,195,255,.10);
    border-color: rgba(79,195,255,.35);
  }

  /* ---------- Pulsanti ---------- */
  button {
    height: 44px;
    padding: 0 20px;
    border: 1px solid var(--bordo);
    border-radius: var(--raggio-s);
    background: var(--glass-strong);
    color: var(--testo);
    font: inherit; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: transform .15s, filter .2s, background .2s;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.12); }
  button:active { transform: translateY(0); }

  .btn-primary   { background: linear-gradient(135deg, #00c6ff, #0072ff); border: none; box-shadow: 0 6px 18px rgba(0,114,255,.35); }
  .btn-secondary { background: rgba(255,255,255,.10); }
  .btn-success   { background: rgba(34,211,166,.22); border-color: rgba(34,211,166,.5); }
  .btn-danger    { background: rgba(255,107,107,.22); border-color: rgba(255,107,107,.5); }
  .btn-small     { height: 32px; padding: 0 12px; font-size: .8rem; border-radius: 9px; }

  .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }

  /* ---------- Messaggi ---------- */
  .msg {
    margin-top: 0; max-height: 0; overflow: hidden; opacity: 0;
    border-radius: var(--raggio-s); font-weight: 600;
    transition: all .3s;
  }
  .msg.ok, .msg.err { max-height: 60px; opacity: 1; margin-top: 14px; padding: 10px 14px; }
  .msg.ok  { background: rgba(34,211,166,.18); border: 1px solid rgba(34,211,166,.45); }
  .msg.err { background: rgba(255,107,107,.18); border: 1px solid rgba(255,107,107,.45); }

  /* ---------- Barra ricerca ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .toolbar input { flex: 1 1 260px; width: auto; }

  /* ---------- Tabella ---------- */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--bordo);
    border-radius: var(--raggio-s);
  }
  table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: .88rem; }
  th, td { padding: 11px 12px; text-align: left; vertical-align: middle; }
  th {
    background: rgba(255,255,255,.08);
    color: var(--testo-soft);
    font-size: .72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
    white-space: nowrap;
  }
  td { border-top: 1px solid rgba(255,255,255,.10); }
  tbody tr:hover td { background: rgba(255,255,255,.06); }
  td.note { max-width: 220px; color: var(--testo-soft); overflow-wrap: anywhere; }
  td:last-child { white-space: nowrap; }
  td:last-child button + button { margin-left: 6px; }
  td.vuoto { text-align: center; padding: 30px; color: var(--testo-soft); }

  /* ---------- Stato programma ---------- */
  #stato {
    display: block; width: fit-content;
    margin: 10px auto 30px;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: .8rem;
    background: rgba(255,107,107,.18);
    border: 1px solid rgba(255,107,107,.4);
  }
  #stato.attivo { background: rgba(34,211,166,.15); border-color: rgba(34,211,166,.4); }

  /* ---------- Schermata accesso Google ---------- */
  #gdGate {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364) !important;
    font-family: inherit !important;
  }
  #gdGate h2 { font-size: 1.6rem; font-weight: 800; }
  #gdLogin {
    height: 48px !important;
    padding: 0 28px !important;
    border-radius: 14px !important;
    font-weight: 700 !important;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }

  /* ---------- Badge Drive ---------- */
  #gdBadge {
    background: rgba(15,23,42,.6) !important;
    border: 1px solid var(--bordo);
    border-radius: 999px !important;
    padding: 7px 14px !important;
    font: 600 12px -apple-system, "Segoe UI", sans-serif !important;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    bottom: 14px !important; right: 14px !important;
  }

  /* ---------- Smartphone ---------- */
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stats .card { padding: 14px 6px; }
    .stats .lbl { font-size: .65rem; letter-spacing: .04em; }
    .grid { grid-template-columns: 1fr 1fr; }
    .buttons button, .toolbar button { flex: 1 1 auto; }
    .toolbar input { flex-basis: 100%; }
  }
</style>
